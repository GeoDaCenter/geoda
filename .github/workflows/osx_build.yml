# This is a basic workflow to help you get started with Actions

name: Mac OSX builds

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**/README.md'
  # Stop checking osx build on pull request, one has to check is manually
  pull_request:
    branches-ignore:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  osx_build:
    # macos-15 is arm64; macos-15-intel is x86_64. macos-13 (Intel) was
    # retired Dec 4 2025 and macos-14 is unsupported after Nov 2 2026.
    runs-on: ${{ matrix.distro }}
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}

    strategy:
      fail-fast: true
      matrix:
        distro:
          - 'macos-15-intel'
          - 'macos-15'
        include:
          - distro: 'macos-15-intel'
            pre: 'x86_64'
          - distro: 'macos-15'
            pre: 'arm64'
    env:
      GEODA_VER: '1.22.1'
      GEODA_ARCH: ${{ matrix.pre }}
      # Exposed via env so it can be tested in step `if` conditions (the
      # secrets context is not available there). Empty on forks/PRs.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    # Steps represent a sequence of tasks that will be executed as part of the job

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install application certificate
        # Skip on forks / PRs where the signing certificate secret is absent.
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          keychain: ${{ github.run_id }}
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Install dependencies
        run: |
          brew install --quiet wxwidgets gdal boost eigen
          # CLAPACK is built from source by CMake (GEODA_USE_CLAPACK_EXTERNAL=ON)

      - name: Build GeoDa
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGEODA_USE_CLAPACK_EXTERNAL=ON
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package DMG
        run: |
          # create-dmg expects the app at BuildTools/macosx/build/GeoDa.app
          mkdir -p BuildTools/macosx/build
          cp -R build/bin/GeoDa.app BuildTools/macosx/build/
          # Codesign only when the signing certificate is available (upstream
          # repo); forks / PRs skip signing so the build can still be verified.
          if [ -n "${{ env.MACOS_CERTIFICATE }}" ]; then
            # The import-codesign-certs action puts the cert in a keychain
            # named after the run id but does not make it the default; point
            # codesign at it explicitly.
            security default-keychain -s "${{ github.run_id }}.keychain"
            security unlock-keychain -p "${{ github.run_id }}" "${{ github.run_id }}.keychain"
            # Skip signing when the identity is not usable (e.g. an expired
            # certificate on a fork); the build is still verified, just
            # unsigned. find-identity -v only lists non-expired identities.
            if security find-identity -v -p codesigning "${{ github.run_id }}.keychain" | grep -q "Developer ID Application: Geodapress LLC"; then
              # bundle_dylibs.py (CMake POST_BUILD) ad-hoc signs each bundled
              # dylib so the app launches; re-sign them with the Developer ID
              # so the bundle seals correctly for notarization.
              for dylib in BuildTools/macosx/build/GeoDa.app/Contents/Frameworks/*.dylib; do
                codesign --force --timestamp -o runtime -s "Developer ID Application: Geodapress LLC (26M5NG43GP)" "$dylib"
              done
              codesign --force --timestamp -o runtime -s "Developer ID Application: Geodapress LLC (26M5NG43GP)" BuildTools/macosx/build/GeoDa.app
            else
              echo "::warning::Signing identity not found (certificate may be expired); skipping codesign."
            fi
          fi
          VER_MAJOR=$(grep "const int version_major" version.h | sed -e 's/.*const int version_major = \([0-9]*\);.*/\1/')
          VER_MINOR=$(grep "const int version_minor" version.h | sed -e 's/.*const int version_minor = \([0-9]*\);.*/\1/')
          VER_BUILD=$(grep "const int version_build" version.h | sed -e 's/.*const int version_build = \([0-9]*\);.*/\1/')
          GEODA_VERSION=$VER_MAJOR.$VER_MINOR.$VER_BUILD-$GEODA_ARCH
          echo $GEODA_VERSION
          cd BuildTools/macosx/create-dmg
          ./geoda.sh $GEODA_VERSION
          if [ -n "${{ env.MACOS_CERTIFICATE }}" ]; then
            if security find-identity -v -p codesigning "${{ github.run_id }}.keychain" | grep -q "Developer ID Application: Geodapress LLC"; then
              codesign --timestamp -s "Developer ID Application: Geodapress LLC (26M5NG43GP)" -i edu.uchicago.spatial GeoDa$GEODA_VERSION-Installer.dmg
            fi
          fi

      - name: Notarize DMG
        # Best-effort: notarization is an Apple service interaction that can
        # fail for reasons outside the build (e.g. a revoked certificate on a
        # fork, or Apple-side rejection). The build, DMG creation and codesign
        # are the actual verification; a notarization rejection must not turn
        # the check red.
        continue-on-error: true
        run: |
          cd BuildTools/macosx/create-dmg
          DMG_FILE="GeoDa${{ env.GEODA_VER }}-${{ env.GEODA_ARCH }}-Installer.dmg"

          # Notarization requires a signed DMG; skip when the signing identity
          # is not usable (e.g. an expired certificate on a fork), matching the
          # codesign guard in the Package DMG step.
          if [ -n "${{ env.MACOS_CERTIFICATE }}" ] && ! security find-identity -v -p codesigning "${{ github.run_id }}.keychain" | grep -q "Developer ID Application: Geodapress LLC"; then
            echo "Signing identity not usable; skipping notarization"
            exit 0
          fi

          # Check if Apple ID credentials are available
          if [ -z "${{ secrets.APPLE_ID_USERNAME }}" ] || [ -z "${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "Apple ID credentials not available, skipping notarization"
            exit 0
          fi

          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "${{ secrets.APPLE_ID_USERNAME }}" \
            --password "${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_FILE"

          echo "Verifying notarization..."
          xcrun stapler validate "$DMG_FILE"

      # Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: GeoDa-${{ env.GEODA_VER }}-${{ env.GEODA_ARCH }}-MacOS
          path: ${{ github.workspace }}/BuildTools/macosx/create-dmg/GeoDa${{ env.GEODA_VER }}-${{ env.GEODA_ARCH }}-Installer.dmg
