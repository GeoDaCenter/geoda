name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.22.1

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get commit history
        id: get_commits
        run: |
          # Get the previous tag to determine the range
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            # Get commits between previous tag and current tag
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_previous_tag=true" >> $GITHUB_OUTPUT
          else
            # If no previous tag, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --oneline -20)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_previous_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for builds to complete
        run: |
          # Wait until every build workflow (Windows, macOS, Ubuntu, AppImage)
          # triggered by this tag push has finished, so their artifacts exist
          # before we download them. Polls the runs API every 30s.
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Waiting for build workflows on ${COMMIT_SHA}..."
          for attempt in $(seq 1 180); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${COMMIT_SHA}" \
              --jq '[.workflow_runs[] | select(.name != "Create Release")]')
            TOTAL=$(echo "$RUNS" | jq 'length')
            if [ "$TOTAL" -eq 0 ]; then
              echo "  no build runs found yet (attempt $attempt/180); waiting 30s..."
              sleep 30
              continue
            fi
            DONE=$(echo "$RUNS" | jq '[.[] | select(.status == "completed")] | length')
            FAILED=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')
            echo "  completed $DONE/$TOTAL, failed $FAILED (attempt $attempt/180)"
            if [ "$DONE" -eq "$TOTAL" ]; then
              if [ "$FAILED" -gt 0 ]; then
                echo "::warning::One or more build workflows failed; proceeding with available artifacts"
              fi
              break
            fi
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all build artifacts
        # download-artifact@v4 without run-id only looks in the CURRENT run
        # (the Create Release run), which has no artifacts. Pull from every
        # build workflow run at this commit instead.
        run: |
          mkdir -p artifacts
          COMMIT_SHA=$(git rev-parse HEAD)
          RUN_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${COMMIT_SHA}" \
            --jq '.workflow_runs[] | select(.name != "Create Release") | .id')
          if [ -z "$RUN_IDS" ]; then
            echo "::error::No build workflow runs found for ${COMMIT_SHA}"
            exit 1
          fi
          for RUN_ID in $RUN_IDS; do
            echo "Downloading artifacts from run ${RUN_ID}"
            gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
              --dir artifacts --pattern 'GeoDa-*'
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -print | sort

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          release_name: GeoDa ${{ steps.get_version.outputs.version }}
          body: |
            ## GeoDa ${{ steps.get_version.outputs.version }}

            ### What's Changed

            This release includes the following changes since the previous version:

            ${{ steps.get_commits.outputs.commits }}

            For detailed information about changes in this release, see the [changelog](https://github.com/GeoDaCenter/geoda/blob/master/CHANGELOG.md).
          draft: false
          prerelease: false

      - name: Upload Windows 32-bit Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-Windows-x86-installer/GeoDa_1.22_x86_Setup.exe
          asset_name: GeoDa-Windows-x86-installer.zip
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Windows 64-bit Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-Windows-x64-installer/GeoDa_1.22_x64_Setup.exe
          asset_name: GeoDa-Windows-x64-installer.zip
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Windows 8+ 32-bit Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-Windows8+-x86-installer/GeoDa_${{ steps.get_version.outputs.version }}_win8+x86_Setup.exe
          asset_name: GeoDa_${{ steps.get_version.outputs.version }}_win8+x86_Setup.exe
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Windows 8.1+ 64-bit installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-Windows8+-x64-installer/GeoDa_${{ steps.get_version.outputs.version }}_win8+x64_Setup.exe
          asset_name: GeoDa_${{ steps.get_version.outputs.version }}_win8+x64_Setup.exe
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Windows ARM64 Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-Windows-arm64-installer/GeoDa_${{ steps.get_version.outputs.version }}_arm64_Setup.exe
          asset_name: GeoDa_${{ steps.get_version.outputs.version }}_arm64_Setup.exe
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload macOS Intel Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-${{ steps.get_version.outputs.version }}-x86_64-MacOS/GeoDa${{ steps.get_version.outputs.version }}-x86_64-Installer.dmg
          asset_name: GeoDa1.22.0-x86_64-Installer.dmg
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload macOS ARM64 Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-${{ steps.get_version.outputs.version }}-arm64-MacOS/GeoDa${{ steps.get_version.outputs.version }}-arm64-Installer.dmg
          asset_name: GeoDa1.22.0-arm64-Installer
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Linux AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/GeoDa-${{ steps.get_version.outputs.version }}-AppImage/GeoDa-${{ steps.get_version.outputs.version }}-x86_64.AppImage
          asset_name: GeoDa-${{ steps.get_version.outputs.version }}-x86_64.AppImage
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Verify Release Assets
        run: |
          echo "Release created successfully!"
          echo "Release URL: ${{ steps.create_release.outputs.html_url }}"
          echo "Upload URL: ${{ steps.create_release.outputs.upload_url }}"
